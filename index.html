<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1523">
  <title>Suivi Commandes QR</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>📦 Suivi Commandes QR</h1>
      <p>Réception • Satisfaction • Bris • Photos</p>
    </div>
    <button id="adminBtn" class="ghost">Administration</button>
  </header>

  <main id="app"></main>

  <template id="homeTpl">
    <section class="hero card">
      <h2>Suivi de commande</h2>
      <p>Scannez le code QR de votre commande ou entrez son code.</p>
      <div class="row">
        <input id="orderCode" placeholder="Ex. 2026-0148">
        <button id="openOrder">Ouvrir</button>
      </div>
    </section>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
